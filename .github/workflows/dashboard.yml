name: Dashboard validation

on:
  pull_request:
  push:
    branches: [main, 'codex/**']

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: dashboard/deploy/requirements.lock
      - run: python -m pip install -r dashboard/deploy/requirements.lock
      - name: Install pinned native Xray for isolated loopback test
        shell: bash
        run: |
          curl --fail --location --retry 3 -o "$RUNNER_TEMP/xray.zip" https://github.com/XTLS/Xray-core/releases/download/v26.3.27/Xray-linux-64.zip
          echo "23cd9af937744d97776ee35ecad4972cf4b2109d1e0fe6be9930467608f7c8ae  $RUNNER_TEMP/xray.zip" | sha256sum -c -
          mkdir "$RUNNER_TEMP/xray"
          unzip -q "$RUNNER_TEMP/xray.zip" xray -d "$RUNNER_TEMP/xray"
          chmod +x "$RUNNER_TEMP/xray/xray"
          echo "XRAY_TEST_BINARY=$RUNNER_TEMP/xray/xray" >> "$GITHUB_ENV"
      - name: Test both modes and native Xray wire/counter integration
        working-directory: dashboard/tests
        run: python -B -W ignore::ResourceWarning -m unittest test_panel test_media_probes test_xray test_xray_dashboard test_alert_sources test_engine_modes
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: dashboard/web/package-lock.json
      - run: npm ci --no-audit --no-fund
        working-directory: dashboard/web
      - run: node --test tests/engines.test.mjs
        working-directory: dashboard/web
      - run: npm run build
        working-directory: dashboard/web
      - name: Verify committed assets and gzip payloads
        run: node dashboard/web/scripts/check-build.mjs
